[project]
name = "claimwise-agents"
version = "0.1.0"
description = "One Strands agent per bounded context over the Claimwise gold layer, deployed on Bedrock AgentCore"
authors = [
    { name = "Senthilnathan", email = "senthilsweb@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "strands-agents>=1.50.0",
    "duckdb>=1.0.0",
    "boto3>=1.34.0",
    "python-dotenv>=1.0.0",
    "databricks-sql-connector>=3.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "bedrock-agentcore>=1.19.0",
    "bedrock-agentcore-starter-toolkit>=0.3.11",
    # numpy is a transitive dep via databricks-sql-connector -> pandas.
    # Pinned below 2.5 -- 2.5.x is too new to have a published aarch64
    # manylinux wheel yet, which breaks AgentCore's direct_code_deploy
    # cross-compile packaging (it refuses to build from source).
    "numpy<2.5",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
