[project]
name = "claimwise-agents"
version = "0.1.0"
description = "One Strands agent per bounded context over the Claimwise gold layer, deployed on Bedrock AgentCore"
authors = [
    { name = "Senthilnathan", email = "senthilsweb@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "strands-agents>=1.50.0",
    "duckdb>=1.0.0",
    "boto3>=1.34.0",
    "python-dotenv>=1.0.0",
    "databricks-sql-connector>=3.0.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
