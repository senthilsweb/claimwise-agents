    </g>
    <text x="75" y="412" font-size="16" fill="#f1f5f9" font-weight="700">Revenue Analyst</text>
    <text x="75" y="436" font-size="12.5" fill="#94a3b8">KPIs from the published metric</text>
    <text x="75" y="453" font-size="12.5" fill="#94a3b8">layer — never re-derived</text>
    <text x="75" y="474" font-size="11.5" fill="#155e75" font-weight="600" letter-spacing="0.5">gold/metrics</text>
  </g>

  <!-- Claims Investigator : violet -->
  <g>
    <rect x="335" y="320" width="250" height="168" rx="14" fill="#131f35" stroke="#263650"/>
    <rect x="335" y="320" width="250" height="4" rx="2" fill="#a78bfa"/>
    <g transform="translate(355,340) scale(1.5)" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/>
    </g>
    <g transform="translate(541,338) scale(1)" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
    </g>
    <text x="355" y="412" font-size="16" fill="#f1f5f9" font-weight="700">Claims Investigator</text>
    <text x="355" y="436" font-size="12.5" fill="#94a3b8">one claim's real story, told in</text>
    <text x="355" y="453" font-size="12.5" fill="#94a3b8">the order it actually happened</text>
    <text x="355" y="474" font-size="11.5" fill="#6d5bb8" font-weight="600" letter-spacing="0.5">gold/billing · single claim</text>
  </g>

  <!-- Denials & AR Advisor : amber -->
  <g>
    <rect x="615" y="320" width="250" height="168" rx="14" fill="#131f35" stroke="#263650"/>
    <rect x="615" y="320" width="250" height="4" rx="2" fill="#fbbf24"/>
    <g transform="translate(635,340) scale(1.5)" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/>
    </g>
    <g transform="translate(821,338) scale(1)" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
