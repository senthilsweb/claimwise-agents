    </g>
    <text x="635" y="412" font-size="16" fill="#f1f5f9" font-weight="700">Denials &amp; AR Advisor</text>
    <text x="635" y="436" font-size="12.5" fill="#94a3b8">payer scorecards, AR aging,</text>
    <text x="635" y="453" font-size="12.5" fill="#94a3b8">appeal outcomes</text>
    <text x="635" y="474" font-size="11.5" fill="#a16207" font-weight="600" letter-spacing="0.5">gold/billing · portfolio</text>
  </g>

  <!-- Data Steward : emerald -->
  <g>
    <rect x="895" y="320" width="250" height="168" rx="14" fill="#131f35" stroke="#263650"/>
    <rect x="895" y="320" width="250" height="4" rx="2" fill="#34d399"/>
    <g transform="translate(915,340) scale(1.5)" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/>
    </g>
    <g transform="translate(1101,338) scale(1)" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
      <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>
    </g>
    <text x="915" y="412" font-size="16" fill="#f1f5f9" font-weight="700">Data Steward</text>
    <text x="915" y="436" font-size="12.5" fill="#94a3b8">runs dbt tests live, traces</text>
    <text x="915" y="453" font-size="12.5" fill="#94a3b8">lineage, keeps the glossary</text>
    <text x="915" y="474" font-size="11.5" fill="#15803d" font-weight="600" letter-spacing="0.5">governance</text>
  </g>

  <!-- connectors specialists -> data -->
  <path d="M180 492 C180 530, 470 528, 484 556" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M460 492 C460 524, 528 530, 534 556" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M740 492 C740 524, 610 530, 598 556" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M1020 492 C1020 520, 1016 528, 1014 556" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- gold layer -->
  <g>
    <rect x="392" y="560" width="298" height="84" rx="14" fill="#131f35" stroke="#3b3416"/>
    <rect x="392" y="560" width="298" height="4" rx="2" fill="#eab308"/>
    <g transform="translate(414,582) scale(1.4)" fill="none" stroke="#eab308" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/>
    </g>
    <text x="464" y="597" font-size="15" fill="#f1f5f9" font-weight="700">Gold layer</text>
    <text x="464" y="619" font-size="12.5" fill="#94a3b8">DuckDB (dev) / Databricks (prod)</text>
    <text x="464" y="636" font-size="12.5" fill="#94a3b8">read-only, by construction</text>
  </g>

  <!-- dbt -->
  <g>
    <rect x="880" y="560" width="268" height="84" rx="14" fill="#131f35" stroke="#48261d"/>
    <rect x="880" y="560" width="268" height="4" rx="2" fill="#ff694a"/>
    <g transform="translate(902,582) scale(1.4)" fill="none" stroke="#ff694a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7"/><path d="M7 16h10"/>
    </g>
    <text x="952" y="597" font-size="15" fill="#f1f5f9" font-weight="700">dbt</text>
    <text x="952" y="619" font-size="12.5" fill="#94a3b8">dbt test, run live · lineage from</text>
    <text x="952" y="636" font-size="12.5" fill="#94a3b8">manifest.json</text>
  </g>
</svg>
