<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="The Claimwise Revenue Copilot crew: a Supervisor routing to four specialist agents over the gold layer">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- panel -->
  <rect x="0" y="0" width="1200" height="700" rx="20" fill="url(#panel)"/>
  <text x="40" y="48" font-size="14" letter-spacing="3" fill="#64748b" font-weight="600">CLAIMWISE REVENUE COPILOT — THE CREW</text>

  <!-- you -->
  <g>
    <rect x="522" y="64" width="156" height="46" rx="23" fill="#131f35" stroke="#334155"/>
    <g transform="translate(548,75) scale(1)" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
    </g>
    <text x="584" y="93" font-size="16" fill="#e2e8f0" font-weight="600">You</text>
  </g>

  <path d="M600 112 L600 158" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="614" y="140" font-size="12.5" fill="#64748b" font-style="italic">a question, in plain English</text>

  <!-- supervisor -->
  <g>
    <rect x="412" y="162" width="376" height="92" rx="14" fill="#131f35" stroke="#155e75"/>
    <rect x="412" y="162" width="376" height="4" rx="2" fill="#22d3ee"/>
    <g transform="translate(438,192) scale(1.4)" fill="none" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/>
    </g>
    <text x="492" y="200" font-size="18" fill="#f1f5f9" font-weight="700">Supervisor</text>
    <text x="492" y="226" font-size="13" fill="#94a3b8">routes by vocabulary · owns no data tools ·</text>
    <text x="492" y="243" font-size="13" fill="#94a3b8">composes multi-specialist answers</text>
  </g>

  <!-- connectors supervisor -> specialists -->
  <path d="M600 258 C600 292, 180 284, 180 316" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M600 258 C600 292, 460 288, 460 316" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M600 258 C600 292, 740 288, 740 316" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M600 258 C600 292, 1020 284, 1020 316" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- Revenue Analyst : cyan -->
  <g>
    <rect x="55" y="320" width="250" height="168" rx="14" fill="#131f35" stroke="#263650"/>
    <rect x="55" y="320" width="250" height="4" rx="2" fill="#22d3ee"/>
    <g transform="translate(75,340) scale(1.5)" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/>
    </g>
    <g transform="translate(261,338) scale(1)" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
